<!doctype html>
<html lang="ja">
  <head>
    <!-- @include:head-common -->
    <meta name="description" content="株式会社CONNECTへのお問い合わせはこちらから。企業や暮らしの課題についてお気軽にご相談ください。" />
    <link rel="canonical" href="https://ps-connect.jp/contact/" />
    <meta property="og:title" content="お問い合わせ｜株式会社CONNECT" />
    <meta property="og:description" content="まずは、あなたの課題を聞かせてください。株式会社CONNECTのお問い合わせ窓口です。" />
    <meta property="og:url" content="https://ps-connect.jp/contact/" />
    <title>お問い合わせ｜株式会社CONNECT</title>
  </head>
  <body>
    <!-- @include:header -->
    <main class="page-main" id="main">
      <section class="page-hero" aria-labelledby="page-title"><div class="container page-hero__inner"><div data-animation="fade-up"><h1 class="page-hero__title font-en" id="page-title">Contact</h1><p class="page-hero__ja">お問い合わせ</p></div><p class="page-hero__copy" data-animation="fade-up">まずは、あなたの課題を<br />聞かせてください。</p></div></section>
      <nav class="breadcrumb" aria-label="パンくずリスト"><ol class="container"><li><a href="/">Home</a></li><li aria-current="page">Contact</li></ol></nav>
      <section class="content-section">
        <div class="container contact-layout">
          <div class="contact-intro" data-animation="fade-up"><h2>ご質問・ご相談を、<br />お気軽にお寄せください。</h2><p>内容を確認後、担当者よりご連絡します。必須項目をご入力のうえ、送信してください。</p></div>
          <div>
            <p class="contact-notice">現在は画面確認用です。メール送信機能は本番のメール設定後に有効になります。</p>
            <form data-contact-form novalidate>
              <div class="form-row"><label for="company">会社名</label><input type="text" id="company" name="company" autocomplete="organization" maxlength="150" /></div>
              <div class="form-row"><label for="name">お名前<span class="required">Required</span></label><input type="text" id="name" name="name" autocomplete="name" maxlength="100" aria-describedby="name-error" required /><p class="form-error" id="name-error" data-error-for="name" aria-live="polite"></p></div>
              <div class="form-row"><label for="email">メールアドレス<span class="required">Required</span></label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" aria-describedby="email-error" required /><p class="form-error" id="email-error" data-error-for="email" aria-live="polite"></p></div>
              <div class="form-row"><label for="phone">電話番号</label><input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="30" inputmode="tel" /></div>
              <div class="form-row"><label for="subject">お問い合わせ種別<span class="required">Required</span></label><select id="subject" name="subject" aria-describedby="subject-error" required><option value="">選択してください</option><option value="facility">施設衛生・配管洗浄</option><option value="energy">電力・ガス料金削減</option><option value="solar">太陽光関連・名義変更</option><option value="support">補助金・経営支援</option><option value="human-resources">外国人材</option><option value="lifestyle">家具関連</option><option value="other">その他</option></select><p class="form-error" id="subject-error" data-error-for="subject" aria-live="polite"></p></div>
              <div class="form-row"><label for="message">お問い合わせ内容<span class="required">Required</span></label><textarea id="message" name="message" maxlength="5000" aria-describedby="message-error" required></textarea><p class="form-error" id="message-error" data-error-for="message" aria-live="polite"></p></div>
              <div class="form-row"><label class="privacy-check"><input type="checkbox" name="privacy" value="agreed" aria-describedby="privacy-error" required /><span><a href="/privacy/" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する<span class="required">Required</span></span></label><p class="form-error" id="privacy-error" data-error-for="privacy" aria-live="polite"></p></div>
              <button class="form-submit" type="submit"><span>入力内容を確認する</span><span aria-hidden="true">↗</span></button>
              <p class="form-status" data-form-status aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <!-- @include:footer -->
  </body>
</html>
